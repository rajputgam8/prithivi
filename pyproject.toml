[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prithivi"
version = "0.1.0"
description = "A local-first voice assistant for phones and low-RAM devices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Kept in lockstep with requirements.txt. Settings and tool argument models are
# stdlib dataclasses, so pydantic is deliberately absent: installing it cost
# ~30 MB on a device with roughly 750 MB free and nothing imported it.
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.112",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[project.scripts]
prithivi = "prithivi.__main__:main"

[tool.setuptools.packages.find]
include = ["prithivi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: exercises several components together",
    "security: asserts a security invariant from SECURITY.md",
    "hardware: needs a real sensor or device; excluded from CI",
    "live: reaches a real network or paid API; excluded from CI",
]
filterwarnings = ["error::DeprecationWarning:prithivi.*"]

[tool.coverage.run]
source = ["prithivi"]
branch = true
omit = [
    "*/__main__.py",
    "*/voice/*",
    "*/vision/*",
    "*/automation/*",
    "*/api/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# Per-package floors from docs/TESTING.md section 5 are enforced in CI, not
# here, because coverage has no per-package threshold setting:
#   core/       85     state machine + agent loop
#   security/   90     highest risk, highest bar
#   tools/base  90
#   memory/     80
# e.g. `pytest --cov=prithivi.security --cov-fail-under=90`